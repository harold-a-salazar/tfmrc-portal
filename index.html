<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TFMRC Portal</title>
<meta name="description" content="TFMRC Portal - Treasury and Financial Management Reporting and Compliance, Hann Resorts">
<meta name="theme-color" content="#5c4ab7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235c4ab7'/%3E%3Cg fill='%23fff'%3E%3Crect x='14' y='16' width='7' height='34' rx='1'/%3E%3Crect x='28.5' y='10' width='7' height='16' rx='1'/%3E%3Crect x='28.5' y='29' width='7' height='26' rx='1'/%3E%3Crect x='43' y='19' width='7' height='28' rx='1'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%235c4ab7'/%3E%3Cg fill='%23fff'%3E%3Crect x='14' y='16' width='7' height='34' rx='1'/%3E%3Crect x='28.5' y='10' width='7' height='16' rx='1'/%3E%3Crect x='28.5' y='29' width='7' height='26' rx='1'/%3E%3Crect x='43' y='19' width='7' height='28' rx='1'/%3E%3C/g%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#5c4ab7;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#5c4ab7}
  #splash{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,sans-serif;color:#fff;text-align:center;padding:24px;
    background:radial-gradient(900px 600px at 30% 15%,#7565d2 0%,transparent 60%),linear-gradient(135deg,#6c5bcc 0%,#5c4ab7 45%,#4a3a9e 100%);
    transition:opacity .4s ease}
  #splash.hide{opacity:0;pointer-events:none}
  #splash svg{height:56px}
  #splash h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.4px}
  .spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.3);border-top-color:#cae873;border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #slow{display:none;font-size:13.5px;opacity:.9;max-width:320px;line-height:1.5}
  #slow a{color:#cae873;font-weight:700}
</style>
</head>
<body>
  <div id="splash">
    <svg viewBox="0 0 30 50" aria-hidden="true"><g fill="#fff">
      <rect x="1" y="7" width="4.6" height="38" rx=".6"/><rect x="12.7" y="1" width="4.6" height="17" rx=".6"/>
      <rect x="12.7" y="21" width="4.6" height="28" rx=".6"/><rect x="24.4" y="11" width="4.6" height="30" rx=".6"/></g></svg>
    <h1>TFMRC Portal</h1>
    <div class="spin" aria-label="Loading"></div>
    <div id="slow">Taking a while? <a id="direct" href="#" target="_blank" rel="noopener">Open the portal in a new tab &#8599;</a></div>
  </div>

  <iframe id="app" title="TFMRC Portal" allow="clipboard-write"></iframe>

  <script>
    // Your Google Apps Script web app (Deploy > Manage deployments > Web app URL)
    var APP_URL = 'https://script.google.com/macros/s/AKfycbx0dkCP6rHBb-zHKDfkHqaz1h89-5lr56x6mWfx4BoqGYzNx_-wTgDnAXKcCitwePs5SA/exec';

    var frame = document.getElementById('app'), splash = document.getElementById('splash');
    document.getElementById('direct').href = APP_URL;
    frame.addEventListener('load', function(){ setTimeout(function(){ splash.className = 'hide'; }, 300); });
    setTimeout(function(){ document.getElementById('slow').style.display = 'block'; }, 8000);
    frame.src = APP_URL;
  </script>
</body>
</html>
